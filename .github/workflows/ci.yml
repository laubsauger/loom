name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guardrails:
    name: lint + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The full suite includes Dawn GPU tests. Run it locally before pushing;
      # GitHub-hosted runners do not provide the required WebGPU adapter.
      # Vite-only breakage (asset imports, CSS modules, font emission) passes
      # tsc and vitest but fails a real build — so build in CI too.
      - run: pnpm build
