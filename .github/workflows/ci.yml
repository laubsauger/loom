name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guardrails:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Vite-only breakage (asset imports, CSS modules, font emission) passes
      # tsc and vitest but fails a real build — so build in CI too.
      - run: pnpm build
